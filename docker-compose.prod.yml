# ==============================================================================
# Production Docker Compose Orchestration
# Institute Multi-Department Portal (NIT Hamirpur)
# ==============================================================================

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: institute_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-institute_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-institute_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./backend/migrations/000002_materialized_views.up.sql:/docker-entrypoint-initdb.d/02_materialized_views.sql:ro
      - ./backend/migrations/000003_seed_data.up.sql:/docker-entrypoint-initdb.d/03_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-institute_portal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: institute_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # 3. Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: institute_backend_prod
    restart: always
    environment:
      PORT: 8080
      ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-institute_secure_password_2026}
      DB_NAME: ${DB_NAME:-institute_portal}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-production-super-secret-jwt-key-2026-institute}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      DEFAULT_INSTITUTION_ID: ${DEFAULT_INSTITUTION_ID:-11111111-1111-1111-1111-111111111111}
      DEFAULT_DEPARTMENT_ID: ${DEFAULT_DEPARTMENT_ID:-22222222-2222-2222-2222-222222222222}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # 4. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: institute_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - app-network


  # 5. Nginx Gateway & Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: institute_nginx_prod
    restart: always
    ports:
      - "${PORT_BINDING:-127.0.0.1:3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  postgres_data:
    name: institute_postgres_prod_data
  redis_data:
    name: institute_redis_prod_data

networks:
  app-network:
    name: institute_network
    driver: bridge
